<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — MagicDNS</title>
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="3; url=https://magicdns.ru/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='%2300ff9d'%3E%3Cpath%20d='M12%202L2%207l10%205%2010-5-10-5zM2%2017l10%205%2010-5M2%2012l10%205%2010-5'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070d18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: linear-gradient(145deg, rgba(14, 25, 44, 0.8) 0%, rgba(8, 14, 25, 0.95) 100%);
      border: 1px solid rgba(0, 255, 157, 0.25);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 255, 157, 0.1);
      backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #00ff9d;
      background: rgba(0, 255, 157, 0.1);
      border: 1px solid rgba(0, 255, 157, 0.3);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.96rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #00ff9d;
      color: #070d18;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
    }
  </style>
  <script>
    (function() {
      var p = window.location.pathname.toLowerCase();
      var target = '/';
      if (p.indexOf('feedback') !== -1 || p.indexOf('reviews') !== -1) {
        target = '/#reviews';
      } else if (p.indexOf('setup') !== -1 || p.indexOf('ios') !== -1 || p.indexOf('android') !== -1 || p.indexOf('linux') !== -1 || p.indexOf('win') !== -1) {
        target = '/#setup';
      } else if (p.indexOf('faq') !== -1) {
        target = '/#faq';
      }
      setTimeout(function() {
        window.location.replace(target);
      }, 300);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">404 • Страница не найдена</div>
    <h1>Перенаправляем...</h1>
    <p>Кажется, адрес изменился или была допущена опечатка. Через пару секунд откроется главная страница MagicDNS.</p>
    <a href="/" class="btn">На главную страницу →</a>
  </div>
</body>
</html>
